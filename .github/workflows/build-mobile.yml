name: 🚀 黑湾代驾MAX Mobile App & Web CI/CD Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-and-web:
    name: 📱 Build Android APK & Baota Web Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK (Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐘 Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Node dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🎨 Generate Mobile Assets & Icons
        run: |
          pip install Pillow
          python3 scripts/generate_mobile_assets.py

      - name: 🔨 Build Web Assets & Server
        run: |
          npm run build

      - name: ⚡ Sync Capacitor Android Native Code
        run: |
          npx cap sync android

      - name: 🤖 Build Android APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.7 || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Generate Baota Deploy Packages
        run: |
          python3 create_deploy_zip.py

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heiwan-Daijia-MAX-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: 📤 Upload Baota Web Deploy Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heiwan-Daijia-MAX-Baota-Web-Deployment-Zip
          path: daijia_deploy.zip
          if-no-files-found: warn

  build-ios-project:
    name: 🍎 Build iOS Xcode Bundle & TrollStore IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🎨 Generate Mobile Assets & Icons
        run: |
          python3 scripts/generate_mobile_assets.py

      - name: 🔨 Build Web Assets
        run: |
          npm run build

      - name: ⚡ Sync Capacitor iOS Native Project
        run: |
          npx cap sync ios

      - name: 🍎 Build Unsigned iOS IPA (TrollStore / 巨魔安装包)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath ../../build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO || true
          cd ../..
          if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            mkdir -p Payload
            cp -r build/App.xcarchive/Products/Applications/App.app Payload/
            zip -r Heiwan_Daijia_MAX_TrollStore.ipa Payload/
          else
            echo "Xcode archive app bundle not generated directly, preparing source package..."
          fi

      - name: 📦 Archive iOS App Project
        run: |
          zip -r Heiwan_Daijia_MAX_iOS_Source.zip ios/

      - name: 📤 Upload iOS TrollStore IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heiwan-Daijia-MAX-iOS-TrollStore-IPA
          path: Heiwan_Daijia_MAX_TrollStore.ipa
          if-no-files-found: ignore

      - name: 📤 Upload iOS App Xcode Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heiwan-Daijia-MAX-iOS-Xcode-Project
          path: Heiwan_Daijia_MAX_iOS_Source.zip
          if-no-files-found: warn

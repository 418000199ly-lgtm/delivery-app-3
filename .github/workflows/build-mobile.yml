name: 🚀 黑湾代驾MAX 司机端安卓构建 CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ==========================================
  # 任务: 仅打包 手机端（司机）Android APK
  # ==========================================
  build-android:
    name: 📱 打包 黑湾代驾MAX 司机端 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Generate Mobile Assets & Icons
        run: |
          python3 scripts/generate_mobile_assets.py || node scripts/generate-icons.js

      - name: Capacitor Sync
        run: |
          npx cap sync android

      - name: Fix Gradle Wrapper Jar
        run: |
          cd android
          gradle wrapper --gradle-version 8.7 --distribution-type all

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Driver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 黑湾代驾MAX-手机司机端-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

